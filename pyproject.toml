[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "cav-gridlock-recovery"
version = "0.1.0"
description = "Système autonome de détection et de résolution active des conflits routiers dans un réseau de véhicules connectés et automatisés."
requires-python = ">=3.12"
dependencies = [
    "networkx==3.7",
]

[project.optional-dependencies]
sumo = [
    "eclipse-sumo==1.27.1",
    "traci==1.27.1",
    "sumolib==1.27.1",
    "sumo-data==1.27.1",
    "pyproj==3.7.2",
]
metadrive = [
    "metadrive-simulator @ git+https://github.com/metadriverse/metadrive.git@fe54b03327b14bcfc17a9a04b60c8abbee4d7ab1",
    "Panda3D==1.10.16",
    "gymnasium==1.4.0",
    "numpy==2.5.4",
    "shapely==2.2.0",
    "pygame==2.6.1",
    "pillow==13.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cav_recovery = ["scenarios/kintambo/*.json", "scenarios/kintambo/*.gz"]

[project.scripts]
cgr = "cav_recovery.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
