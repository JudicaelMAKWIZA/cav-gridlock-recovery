[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "cav-gridlock-recovery"
version = "0.1.0"
description = "Système autonome de détection et de résolution active des conflits routiers dans un réseau de véhicules connectés et automatisés."
requires-python = ">=3.12"
dependencies = [
    "networkx==3.7",
]

[project.optional-dependencies]
laboratory = [
    "torch==2.14.1",
    "numpy==2.5.4",
    "orjson>=3.10,<4",
    "matplotlib==3.11.2",
    "nbformat>=5.10,<6",
    "nbclient>=0.10,<0.11",
    "ipykernel>=6.29,<8",
    "psutil==7.2.2",
]

d01 = [
    "shapely==2.2.0",
]
metadrive = [
    "metadrive-simulator @ git+https://github.com/metadriverse/metadrive.git@fe54b03327b14bcfc17a9a04b60c8abbee4d7ab1",
    "Panda3D==1.10.16",
    "gymnasium==1.4.0",
    "numpy==2.5.4",
    "shapely==2.2.0",
    "pygame==2.6.1",
    "pillow==13.0.0",
    "psutil==7.2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
cgr = "cav_recovery.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/communication"]
pythonpath = ["src", "."]

markers = ["scientific: contrôles longs avec génération de jeux de test", "integration: moteur MetaDrive natif"]
